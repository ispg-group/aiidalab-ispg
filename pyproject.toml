[build-system]
# Version 64.0.0 is needed for editable installs without setup.py file
# https://setuptools.pypa.io/en/latest/references/keywords.html
requires = [
    "setuptools>=64.0.0",
    "wheel"
]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88
src = ["aiidalab_ispg", "tests", "tests_integration", "notebooks"]
target-version = "py39"

[tool.ruff.lint.isort]
known-first-party = ["aiida", "aiidalab_widgets_base", "aiidalab_ispg"]

[tool.ty.environment]
python-version = "3.12"

[tool.pytest.ini_options]
addopts = '--strict-config --strict-markers -ra'
filterwarnings = [
  'ignore:Creating AiiDA configuration folder:UserWarning:aiida:',
  # We cannot filter for sqlalchemy.exc.SAWarning, because sqlalchemy is not installed
  # for selenium UI tests.
  'ignore:Object of type .* not in session, .* operation along .* will not proceed:',
  # https://github.com/aiidateam/plumpy/issues/283
  'ignore:There is no current event loop:DeprecationWarning:plumpy',
  'ignore:datetime\.datetime\.utcfromtimestamp\(\) is deprecated:DeprecationWarning:pytz',
  'ignore::DeprecationWarning:bokeh:',
]

[tool.inline-snapshot]
format-command="ruff format --stdin-filename {filename}"

[tool.bumpver]
current_version = "v0.2.6"
version_pattern = "vMAJOR.MINOR.PATCH[PYTAGNUM]"
commit_message = "bump version {old_version} -> {new_version}"
commit = true
tag = true
push = true

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'current_version = "{version}"',
]
"setup.cfg" = [
    'version = {pep440_version}',
]
"aiidalab_ispg/__init__.py" = [
    '__version__ = "{pep440_version}"',
]
