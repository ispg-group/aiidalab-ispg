[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = ["aiidalab_ispg"]

[tool.aiidalab]
title = "ISPG Apps"
description = "AiiDALab applications from the ISPG crew"
categories = ["quantum"]

#[options.package_data]
#aiidalab_ispg.app.static =
#  *.png
#  *.jinja
#  *.css
#  *.csv

[project]
name = "aiidalab-ispg"
version = "0.2.6"
description = "ISPG applications in AiiDALab"
authors = [{name = 'Daniel Hollas', email = 'daniel.hollas@bristol.ac.uk'}]
license = 'MIT'
license-files = ['LICENSE']
readme = 'README.md'
classifiers = [
  'Operating System :: POSIX :: Linux',
  'Operating System :: MacOS :: MacOS X',
  'Programming Language :: Python :: 3',
  'Development Status :: 4 - Beta',
  'Topic :: Scientific/Engineering',
  'Framework :: AiiDA',
]

requires-python = '>=3.12'
dependencies = [
   'aiidalab-widgets-base[smiles]~=3.0.0; python_version > "3.9"',
   'aiidalab-widgets-base~=2.5.0; python_version <= "3.9"',
   'aiida-orca~=0.7.0',
   'bokeh>=2.4,<4',
   'traitlets~=5.9',
   'ipywidgets~=7.7; python_version <= "3.9"',
   'ipywidgets~=8.1; python_version > "3.9"',
   'psutil>=5.9',
   'rdkit<2025',
]

[project.urls]
Documentation = 'https://github.com/danielhollas/aiidalab-ispg/#readme'
Home = 'https://github.com/danielhollas/aiidalab-ispg'
#Bug-Tracker = https://github.com/danielhollas/aiidalab-ispg/issues
#Logo = https://insilicophotochem.files.wordpress.com/2020/01/squirrel-logo.png

[project.entry-points.'aiida.workflows']
'ispg.atmospec' = 'aiidalab_ispg.workflows:AtmospecWorkChain'
'ispg.conformer_opt' = 'aiidalab_ispg.workflows.optimization:ConformerOptimizationWorkChain'

[project.entry-points.'aiida.calculations']
'ispg.wigner' = 'aiidalab_ispg.workflows:generate_wigner_structures'

[dependency-groups]
dev = [
  "ty==0.0.88",
  "pytest~=8.3.0",
  "pytest-cov~=7.1",
  "pytest-docker~=3.0",
  "pytest-selenium~=4.1",
  "selenium==4.20.0",
  "inline-snapshot~=0.35.0",
]


[tool.ruff]
line-length = 88
src = ["aiidalab_ispg", "tests", "tests_integration", "notebooks"]
target-version = "py39"

[tool.ruff.lint.isort]
known-first-party = ["aiida", "aiidalab_widgets_base", "aiidalab_ispg"]

[tool.ty.environment]
python-version = "3.12"

[tool.pytest.ini_options]
addopts = '--strict-config --strict-markers -ra'
filterwarnings = [
  'ignore:Creating AiiDA configuration folder:UserWarning:aiida:',
  # We cannot filter for sqlalchemy.exc.SAWarning, because sqlalchemy is not installed
  # for selenium UI tests.
  'ignore:Object of type .* not in session, .* operation along .* will not proceed:',
  # https://github.com/aiidateam/plumpy/issues/283
  'ignore:There is no current event loop:DeprecationWarning:plumpy',
  'ignore:datetime\.datetime\.utcfromtimestamp\(\) is deprecated:DeprecationWarning:pytz',
  'ignore::DeprecationWarning:bokeh:',
]

[tool.inline-snapshot]
format-command="ruff format --stdin-filename {filename}"

[tool.bumpver]
current_version = "v0.2.6"
version_pattern = "vMAJOR.MINOR.PATCH[PYTAGNUM]"
commit_message = "bump version {old_version} -> {new_version}"
commit = true
tag = true
push = true

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'current_version = "{version}"',
]
"setup.cfg" = [
    'version = {pep440_version}',
]
"aiidalab_ispg/__init__.py" = [
    '__version__ = "{pep440_version}"',
]
